# XcodeGen spec for OrbitMaze (XcodeGen 2.46). Run `xcodegen` in this folder
# to produce OrbitMaze.xcodeproj.
#
# Single-target watchOS app (no iOS companion). XcodeGen maps
# `type: application` + `platform: watchOS` to Xcode's modern "Watch App"
# product (SDKROOT watchos, TARGETED_DEVICE_FAMILY 4) via its bundled
# Product_Platform/application_watchOS preset.

name: OrbitMaze

options:
  deploymentTarget:
    watchOS: "11.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    # CHANGE THIS before building on a real watch. Bundle identifiers are
    # unique per Apple developer account, so anyone cloning this repo must use
    # their own reverse-DNS id, e.g. com.yourname.orbitmaze. Set your signing
    # team in Xcode (Signing & Capabilities) or add DEVELOPMENT_TEAM below.
    PRODUCT_BUNDLE_IDENTIFIER: com.surendran.orbitmaze
    # DEVELOPMENT_TEAM: ABCDE12345
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"            # Swift 6 language mode (strict concurrency)
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  OrbitMaze:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: Core
      - path: App
    settings:
      base:
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # VERIFY: XcodeGen's watchOS preset sets SKIP_INSTALL YES (meant for
        # embedded watch apps). A top-level watch-only app must be installed or
        # Archive produces a "Generic Xcode Archive".
        SKIP_INSTALL: NO
        TARGETED_DEVICE_FAMILY: "4"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: OrbitMaze
        # Marks this bundle as a watchOS app (single-target, no WatchKit extension).
        WKApplication: true
        # VERIFY: WKWatchOnly — Xcode's "Watch-only App" template sets this so
        # the App Store lists the app without an iOS companion.
        WKWatchOnly: true
        # NSMotionUsageDescription is intentionally absent: CMMotionManager
        # accelerometer / deviceMotion do not require it. It is only needed
        # for CMMotionActivityManager, CMPedometer and CMSensorRecorder.
    scheme:
      configVariants: []
      gatherCoverageData: false
